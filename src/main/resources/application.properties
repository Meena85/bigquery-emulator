quarkus.http.port=9050

quarkus.analytics.disabled=true
quarkus.http.test-timeout=3s
quarkus.jackson.serialization-inclusion=non-empty

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bigquery
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.acquisition-timeout=5S

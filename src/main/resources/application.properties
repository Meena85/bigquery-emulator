quarkus.http.host=${QUARKUS_HTTP_HOST:0.0.0.0}
quarkus.http.port=${QUARKUS_HTTP_PORT:9050}

quarkus.analytics.disabled=${QUARKUS_ANALYTICS_DISABLED:true}
quarkus.http.test-timeout=${QUARKUS_HTTP_TEST_TIMEOUT:3s}
quarkus.jackson.serialization-inclusion=${QUARKUS_JACKSON_SERIALIZATION_INCLUSION:non-empty}

quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:postgresql}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/bigquery}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}

quarkus.datasource.jdbc.min-size=${QUARKUS_DATASOURCE_JDBC_MIN_SIZE:0}
quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:10}
quarkus.datasource.jdbc.initial-size=${QUARKUS_DATASOURCE_JDBC_INITIAL_SIZE:1}
quarkus.datasource.jdbc.acquisition-timeout=${QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT:5S}

